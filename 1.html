<!-- Inline critical CSS so the very first paint is dark, never white -->
<style>
  html, body {
    margin: 0; padding: 0;
    background: #030C08; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', 'Inter', system-ui, 'Segoe UI', Roboto, sans-serif;

    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }
  #root {
    min-height: 100vh; min-height: 100dvh;
    width: 100%;
    background: #06180F;
    display: flex; justify-content: center;
  }
  /* Pre-hydration skeleton: a soft pulsing dark glow so users see something while Babel/React parse */
  #root::before {
    content: '';
    display: block;
    width: 100%; max-width: 440px;
    background: radial-gradient(ellipse at top, #0C2E1E 0%, #06180F 50%, #04140D 100%);
    animation: __preboot 1.4s ease-in-out infinite alternate;
  }
  @keyframes __preboot { from { opacity: 0.85; } to { opacity: 1; } }
  /* Hide skeleton once React mounts (it'll inject children into #root) */
  #root:has(*)::before { display: none; }
</style>
